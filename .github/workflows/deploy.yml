name: CI/CD Pipeline

on:
  push:
    branches: [dev, staging, master]

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/horizonapp-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/horizonapp-backend

jobs:
  # --- BUILD FRONTEND AND BACKEND ---
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./horizon-ui/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name == 'master' && 'prod' || github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./horizon-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name == 'master' && 'prod' || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
