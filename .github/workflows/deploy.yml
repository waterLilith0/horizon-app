name: CI/CD Pipeline

on:
  push:
    branches: [dev, staging, main]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/horizonapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Automatically handles tags based on your branches
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=raw,value=staging,enable=${{ github.ref_name == 'staging' }}
            type=raw,value=prod,enable=${{ github.ref_name == 'main' }}

      # Build multi-architecture image (supports both 32-bit and 64-bit Pi OS versions)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./horizon-app
          file: ./horizon-app/Dockerfile
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
