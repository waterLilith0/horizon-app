name: CI/CD Pipeline

on:
  push:
    branches: [dev, staging, main]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/horizonapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./horizon-app
          file: ./horizon-app/Dockerfile
          platforms: linux/arm/v7,linux/arm64
          push: true
          # This line forces 'prod' for main, and uses the exact branch name for dev/staging
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
