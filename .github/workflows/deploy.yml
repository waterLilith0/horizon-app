name: CI/CD Pipeline

on:
  push:
    branches: [staging, master]

permissions:
  contents: read

# One deploy per branch at a time, so two quick pushes can't race to push the
# same image tag. A running deploy is never cancelled, the next one waits.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/horizonapp-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/horizonapp-backend

jobs:
  # --- CHECK THE FRONTEND BEFORE ANYTHING IS SHIPPED ---
  frontend-checks:
    uses: ./.github/workflows/frontend.yml

  # --- BUILD FRONTEND AND BACKEND ---
  build-images:
    needs: frontend-checks
    runs-on: ubuntu-latest
    # Selects the GitHub environment whose Faro variables and secret apply to this branch.
    environment: ${{ github.ref_name == 'master' && 'production' || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./horizon-ui/Dockerfile
          # The VITE_ values are baked into the static bundle and visible to every visitor, so none of these are secrets.
          build-args: |
            VITE_FARO_ENABLED=true
            VITE_FARO_URL=https://faro-collector-prod-eu-west-2.grafana.net/collect/2e287856121a949cb739c514462482ca
            VITE_APP_ENV=${{ github.ref_name == 'master' && 'production' || github.ref_name }}
            FARO_UPLOAD_ENDPOINT=${{ vars.FARO_UPLOAD_ENDPOINT }}
            FARO_APP_ID=${{ vars.FARO_APP_ID }}
            FARO_STACK_ID=${{ vars.FARO_STACK_ID }}
            FARO_GIT_HASH=${{ github.sha }}
          # Mounted only for the build step, so it never ends up in an image layer.
          secrets: |
            faro_api_key=${{ secrets.FARO_API_KEY }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name == 'master' && 'prod' || github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./horizon-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name == 'master' && 'prod' || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
