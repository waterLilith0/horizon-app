name: CI/CD Pipeline

on:
  push:
    branches: [dev, staging, main]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/horizonapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Determine environment tag based on target branch
      - name: Set Environment Tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # Build multi-architecture image (supports both 32-bit and 64-bit Pi OS versions)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./horizon-app
          file: ./horizon-app/Dockerfile
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
