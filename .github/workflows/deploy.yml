name: CI/CD Pipeline

on:
  push:
    branches: [staging, master]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time, so two quick pushes can't race to push the
# same image tag. A running deploy is never cancelled, the next one waits.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/horizonapp-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/horizonapp-backend

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/staging|refs/heads/master) ;;
            *)
              echo "::error::Deployments can only run from the staging or master branch."
              exit 1
              ;;
          esac

  # --- CHECK THE FRONTEND BEFORE ANYTHING IS SHIPPED ---
  frontend-checks:
    needs: validate-ref
    uses: ./.github/workflows/frontend.yml

  # --- BUILD FRONTEND AND BACKEND ---
  build-images:
    needs: frontend-checks
    runs-on: ubuntu-latest
    # Selects the GitHub environment whose deployment variables and secrets apply to this branch.
    environment: ${{ github.ref_name == 'master' && 'production' || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check blog URL configuration
        env:
          VITE_BLOG_URL: ${{ vars.VITE_BLOG_URL }}
        run: |
          if [ -z "$VITE_BLOG_URL" ]; then
            echo "::error::Set VITE_BLOG_URL in the selected GitHub environment."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./horizon-ui/Dockerfile
          # The VITE_ values are baked into the static bundle and visible to every visitor, so none of these are secrets.
          build-args: |
            VITE_FARO_ENABLED=true
            VITE_FARO_URL=https://faro-collector-prod-eu-west-2.grafana.net/collect/2e287856121a949cb739c514462482ca
            VITE_APP_ENV=${{ github.ref_name == 'master' && 'production' || github.ref_name }}
            VITE_BLOG_URL=${{ vars.VITE_BLOG_URL }}
            FARO_UPLOAD_ENDPOINT=${{ vars.FARO_UPLOAD_ENDPOINT }}
            FARO_APP_ID=${{ vars.FARO_APP_ID }}
            FARO_STACK_ID=${{ vars.FARO_STACK_ID }}
            FARO_GIT_HASH=${{ github.sha }}
          # Mounted only for the build step, so it never ends up in an image layer.
          secrets: |
            faro_api_key=${{ secrets.FARO_API_KEY }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name == 'master' && 'prod' || github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and Push Backend Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./horizon-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name == 'master' && 'prod' || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
