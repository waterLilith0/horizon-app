name: Frontend

on:
  pull_request:
    paths:
      - "horizon-ui/**"
      - ".github/workflows/frontend.yml"
  # So the deploy workflow can run the same checks before it ships anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Types, lint, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: horizon-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The same major as the Dockerfile's build stage.
          node-version: 24
          cache: npm
          cache-dependency-path: horizon-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Check formatting
        run: npm run format:check

      # Without FARO_API_KEY the build skips the sourcemap upload, so it needs no secrets.
      - name: Build
        run: npm run build
