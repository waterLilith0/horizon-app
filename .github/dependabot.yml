version: 2

updates:
  - package-ecosystem: npm
    directory: /horizon-ui
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directories:
      - /horizon-api
      - /horizon-api-integration-tests
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /horizon-ui
      - /horizon-api
    schedule:
      interval: weekly
