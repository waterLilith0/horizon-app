server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Routes non-file requests to index.html so React Router handles 404s
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Returns true 404 for missing assets instead of serving HTML
    location /assets/ {
        try_files $uri =404;
    }
}